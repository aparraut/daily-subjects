<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Materias Diarias</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="appNotice" class="app-notice" role="status" aria-live="polite" style="display:none;">
    <span id="appNoticeText"></span>
    <button id="appNoticeClose" type="button" aria-label="Cerrar mensaje">x</button>
  </div>

  <!-- Botones fijos -->
  <button id="btnLogout" title="Cerrar sesion">Salir</button>
  <button id="toggleTheme" class="theme-toggle" title="Cambiar tema">Tema</button>

  <!-- AUTH -->
  <div id="authScreen" class="panel" style="max-width:780px;margin:20px auto;">
    <h1>Iniciar sesion</h1>
    <div class="stack" style="margin:12px 0 6px">
      <input id="email" type="email" placeholder="tu@email" />
      <input id="password" type="password" placeholder="contrasena" />
    </div>
    <div class="stack" style="justify-content:center;margin-top:8px">
      <button id="btnSignIn" class="btn-home">Entrar</button>
      <button id="btnSignUp">Crear cuenta</button>
    </div>
    <p class="muted" style="text-align:center;margin-top:8px">
      <a href="#" id="linkReset">Olvidaste tu contrasena?</a>
    </p>
    <p id="authMsg" class="muted" style="text-align:center;margin-top:10px"></p>
  </div>

  <!-- Home -->
  <div id="homeScreen" class="panel" style="max-width:900px;margin:20px auto;display:none;">
    <h1>Materias Diarias</h1>
    <p class="muted" style="text-align:center">Bienvenido. Desde aqui vas a tu tablero semanal.</p>
    <div class="stack" style="justify-content:center">
      <button id="enterButton" class="btn-home">Ir a mis materias</button>
    </div>
  </div>

  <!-- App -->
  <div id="appContent" style="display:none;max-width:1100px;margin:0 auto;">
    <h1>Materias Diarias</h1>

    <div class="week-selector">
      <button id="prev_week"><- Semana anterior</button>
      <input type="date" id="week_date">
      <button id="next_week">Semana siguiente -></button>
    </div>

    <p id="week_range"></p>

    <!-- Toggle Activas / Historico -->
    <div class="stack" style="justify-content:center;margin:0 0 18px;">
      <button id="toggleSubjectsBtn">Ver historico (12)</button>
    </div>

    <h2 style="text-align:center">Resumen semanal (Dom-Sab)</h2>
    <table id="weeklyTable">
      <thead>
        <tr>
          <th>Materia</th>
          <th>Dom</th>
          <th>Lun</th>
          <th>Mar</th>
          <th>Mie</th>
          <th>Jue</th>
          <th>Vie</th>
          <th>Sab</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="recoveryModal" class="modal-backdrop" style="display:none;">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recoveryTitle">
      <h3 id="recoveryTitle">Restablecer contrasena</h3>
      <p class="muted">Ingresa una nueva contrasena (minimo 6 caracteres).</p>
      <input id="recoveryPassword" type="password" placeholder="Nueva contrasena" minlength="6" />
      <p id="recoveryMsg" class="muted" style="min-height:20px;margin:8px 0 0;"></p>
      <div class="stack" style="justify-content:flex-end;margin-top:10px;">
        <button id="recoveryCancel" type="button">Cancelar</button>
        <button id="recoverySave" type="button" class="btn-home">Guardar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
